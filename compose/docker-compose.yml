services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: orekit
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: orekit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://orekit:changeme@db:5432/orekit
    depends_on:
      - db

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  # Hardened production container (S-9): non-root user, static build (no dev-server), read-only
  # filesystem. A plain `docker compose up` does not start it; it only runs under the "prod"
  # profile, so the normal dev setup above is untouched. It serves the static site only. In
  # production the maintainer's reverse proxy handles /api (out of scope, docs/stage_3.md).
  web-prod:
    profiles: ["prod"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - api

volumes:
  postgres_data:
