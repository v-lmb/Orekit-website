services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: orekit
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: orekit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://orekit:changeme@db:5432/orekit
    depends_on:
      - db

  web:
    build:
      context: ../apps/web
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - api

volumes:
  postgres_data:
